<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Invoice Extractor</title>
<style>
  :root {
    --ink: #1c2530;
    --muted: #6b6459;
    --paper: #f5f4f0;
    --surface: #ffffff;
    --line: #dcd7cd;
    --line-strong: #c4beb1;
    --accent: #2f6f4f;
    --accent-dark: #245a3f;
    --accent-soft: #e3f1e9;
    --accent-ink: #ffffff;
    --error: #a3382c;
    --error-soft: #f7e4e1;
    --error-line: #e0b6ae;
    --warning: #8a5a10;
    --warning-soft: #fbeecf;
    --edited: #4a6a8a;
    --focus-ring: #2f6f4f;
    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(28, 37, 48, 0.06);
  }

  * { box-sizing: border-box; }

  :focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header.app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .app-header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 1.35rem;
  }

  .app-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem 1.5rem;
    flex-wrap: wrap;
  }

  .app-header-text {
    min-width: 0;
    flex: 1 1 220px;
  }

  .app-title {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 0.4rem;
  }

  .app-title .mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.9rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  p.lede {
    color: var(--muted);
    margin: 0;
    max-width: 58ch;
    font-size: 1rem;
  }

  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    flex-shrink: 0;
    margin-top: 0.2rem;
  }

  .lang-btn {
    height: 1.9rem;
    padding: 0 0.65rem;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
  }

  .lang-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .lang-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .lang-sep {
    color: var(--line-strong);
    font-size: 0.8rem;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .panel + .panel {
    margin-top: 1.5rem;
  }

  .panel-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 1rem;
  }

  /* Dropzone */
  .dropzone {
    position: relative;
    border: 2px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 2rem 1.25rem;
    text-align: center;
    background: var(--paper);
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .dropzone.dragging {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .dropzone.has-file {
    border-style: solid;
    border-color: var(--line-strong);
  }

  .visually-hidden-input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .visually-hidden-input:focus-visible + .dropzone-label {
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
    border-radius: calc(var(--radius) - 2px);
  }

  .dropzone-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
  }

  .dropzone-icon {
    width: 2rem;
    height: 2rem;
    color: var(--muted);
  }

  .dropzone-title {
    font-weight: 600;
    font-size: 1rem;
  }

  .dropzone-title .browse-text {
    color: var(--accent);
    text-decoration: underline;
  }

  .dropzone-sub {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .dropzone-filename {
    margin: 0.85rem 0 0;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .dropzone-filename:empty {
    display: none;
  }

  .field-hint {
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    margin-top: 1.25rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
  }

  .format-control {
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }

  .inline-field-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
  }

  select {
    font: inherit;
    font-size: 0.9rem;
    height: 2.65rem;
    padding: 0 0.7rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }

  button {
    font: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    height: 2.65rem;
    padding: 0 1.2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }

  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
  }

  button.primary:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  button.secondary {
    background: var(--surface);
    border-color: var(--line-strong);
    color: var(--ink);
  }

  button.secondary:hover:not(:disabled) {
    border-color: var(--ink);
  }

  button.secondary.emphasis {
    border-color: var(--accent);
    color: var(--accent-dark);
    background: var(--accent-soft);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status-line {
    margin-top: 1rem;
    font-size: 0.875rem;
    color: var(--muted);
    min-height: 1.4em;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  .status-spinner {
    display: none;
    width: 0.85em;
    height: 0.85em;
    flex-shrink: 0;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
  }

  .status-line.busy .status-spinner {
    display: inline-block;
  }

  @media (prefers-reduced-motion: no-preference) {
    .status-line.busy .status-spinner {
      animation: spin 0.7s linear infinite;
    }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status-line.error {
    color: var(--error);
    background: var(--error-soft);
    border: 1px solid var(--error-line);
    border-radius: 6px;
    padding: 0.55rem 0.75rem;
  }

  .status-icon:empty {
    display: none;
  }

  #result {
    margin-top: 1.5rem;
  }

  #result:empty {
    display: none;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .badge.ready { background: var(--accent-soft); color: var(--accent-dark); }
  .badge.needs_review { background: var(--warning-soft); color: var(--warning); }
  .badge.blocked { background: var(--error-soft); color: var(--error); }

  .status-summary {
    margin: 0 0 1.25rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .form-legend {
    margin: 0 0 1.25rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .required-mark {
    color: var(--error);
  }

  form.invoice-form {
    margin-top: 0;
  }

  fieldset.field-group {
    border: 0;
    margin: 0;
    padding: 0;
    min-width: 0;
  }

  fieldset.field-group + fieldset.field-group {
    margin-top: 2.1rem;
  }

  fieldset.field-group legend {
    width: 100%;
    padding: 0 0 0.5rem;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .fieldset-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem 1.25rem;
  }

  .field-row label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 0.35rem;
  }

  .field-row input {
    width: 100%;
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }

  .field-row input[type="number"] {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .field-row input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .field-row.has-error input { border-color: var(--error); }
  .field-row.has-warning input { border-color: var(--warning); }
  .field-row.edited input { border-color: var(--edited); }

  .field-message {
    margin: 0.35rem 0 0;
    font-size: 0.8rem;
  }

  .field-message.issue-error { color: var(--error); }
  .field-message.issue-warning { color: var(--warning); }
  .field-message.field-message-edited { color: var(--edited); font-style: italic; }

  .form-note {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 1.25rem 0 0;
    padding-top: 0.85rem;
    border-top: 1px dashed var(--line);
  }

  @media (min-width: 640px) {
    .fieldset-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 480px) {
    .app-header-inner { padding: 1.25rem 1rem 1.1rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .panel { padding: 1.15rem; }
    .actions { flex-direction: column; align-items: stretch; }
    .actions > button,
    .actions > .format-control { width: 100%; }
    .format-control select { flex: 1; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">
    <div class="app-header-row">
      <div class="app-header-text">
        <p class="app-title">
          <span class="mark" aria-hidden="true" data-i18n="app.mark">IE</span>
          <span data-i18n="app.name">Invoice Extractor</span>
        </p>
        <p class="lede" data-i18n="app.tagline">
          Extracts structured invoice fields for human review, correction, and
          CSV or Excel export.
        </p>
      </div>
      <div class="lang-switch" role="group" data-i18n-aria-label="lang.switchLabel" aria-label="Language">
        <button type="button" class="lang-btn" id="lang-btn-fr" aria-pressed="false">FR</button>
        <span class="lang-sep" aria-hidden="true">|</span>
        <button type="button" class="lang-btn" id="lang-btn-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="panel">
    <p class="panel-title" data-i18n="upload.heading">Upload an invoice</p>

    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept="application/pdf" class="visually-hidden-input" />
      <label for="file-input" class="dropzone-label">
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="M7 8l5-5 5 5" />
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
        </svg>
        <span class="dropzone-title">
          <span class="browse-text" data-i18n="upload.browse">Click to upload</span>
          <span data-i18n="upload.drag">or drag and drop</span>
        </span>
        <span class="dropzone-sub" data-i18n="upload.constraint">PDF only, up to 10 MB</span>
      </label>
      <p class="dropzone-filename" id="selected-filename" aria-live="polite"></p>
    </div>

    <p class="field-hint" data-i18n="upload.hint">
      Text-based PDFs only (max 10 MB). Uploaded invoices are processed
      transiently and are not permanently stored by the application.
    </p>

    <div class="actions">
      <button type="button" class="primary" id="preview-btn" data-i18n="actions.extract">Extract invoice</button>
      <div class="format-control">
        <label for="format-select" class="inline-field-label" data-i18n="actions.format">Format</label>
        <select id="format-select">
          <option value="csv">CSV</option>
          <option value="xlsx">Excel</option>
        </select>
      </div>
      <button type="button" class="secondary" id="export-btn" disabled data-i18n="actions.download">Download</button>
    </div>

    <div id="status-line" class="status-line" aria-live="polite" role="status">
      <span class="status-spinner" aria-hidden="true"></span>
      <span class="status-icon" aria-hidden="true"></span>
      <span class="status-text"></span>
    </div>
  </div>

  <div id="result"></div>
</main>

<script>
  // ---------------------------------------------------------------------
  // Localization (French / English)
  //
  // Centralized dictionary + t(path, vars) lookup. Static shell elements
  // are retranslated via [data-i18n] walking; the dynamically-rendered
  // #result panel and the status line are retranslated via small render
  // closures (see registerRetranslate / lastStatusRender below) so that a
  // language switch never rebuilds the DOM, never touches <input> values,
  // and never re-runs extraction.
  // ---------------------------------------------------------------------

  const LANG_STORAGE_KEY = "invoice-extractor-language";
  const DEFAULT_LANG = "fr";
  const SUPPORTED_LANGS = ["fr", "en"];

  const translations = {
    en: {
      doc: { title: "Invoice Extractor" },
      app: {
        mark: "IE",
        name: "Invoice Extractor",
        tagline: "Extracts structured invoice fields for human review, correction, and CSV or Excel export.",
      },
      lang: { switchLabel: "Language" },
      upload: {
        heading: "Upload an invoice",
        browse: "Click to upload",
        drag: "or drag and drop",
        constraint: "PDF only, up to 10 MB",
        hint: "Text-based PDFs only (max 10 MB). Uploaded invoices are processed transiently and are not permanently stored by the application.",
      },
      actions: {
        extract: "Extract invoice",
        format: "Format",
        download: "Download",
      },
      status: {
        chooseFile: "Choose a PDF first.",
        reading: "Reading invoice…",
        extractionFailed: "Extraction failed.",
        networkError: "Could not reach the server. Check your connection and try again.",
        extractFirst: "Extract an invoice before exporting.",
        preparing: "Preparing download…",
        exportFailed: "Export failed.",
        downloaded: (v) => `Downloaded ${v.filename}.`,
        ready: "Ready to export",
        needsReview: "Review recommended",
        blocked: "Correction required",
        noIssues: "No issues were found during extraction.",
        blockedSummary: (v) => `${v.count} field${v.count === 1 ? "" : "s"} must be corrected before export.`,
        reviewSummary: (v) => `${v.count} field${v.count === 1 ? "" : "s"} may need a quick check before export.`,
      },
      groups: {
        invoice: "Invoice",
        supplier: "Supplier",
        customer: "Customer",
        amounts: "Amounts",
      },
      fields: {
        invoice_number: "Invoice number",
        invoice_date: "Invoice date",
        total_amount: "Total amount",
        subtotal: "Subtotal",
        tax_amount: "Tax amount",
        currency: "Currency",
        supplier_name: "Supplier name",
        supplier_tax_id: "Supplier tax ID",
        customer_name: "Customer name",
        customer_ICE: "Customer ICE",
      },
      form: {
        requiredLegend: "indicates a field required for export.",
        edited: "Edited - validated when you download.",
        note: "Correct any fields above, then choose a format and download.",
      },
    },
    fr: {
      doc: { title: "Extracteur de factures" },
      app: {
        mark: "EF",
        name: "Extracteur de factures",
        tagline: "Extrait les données structurées de vos factures pour vérification, correction et export CSV ou Excel.",
      },
      lang: { switchLabel: "Langue" },
      upload: {
        heading: "Importer une facture",
        browse: "Cliquez pour sélectionner",
        drag: "ou glissez-déposez",
        constraint: "PDF uniquement, jusqu'à 10 Mo",
        hint: "PDF contenant du texte uniquement (10 Mo maximum). Les factures importées sont traitées de manière transitoire et ne sont pas stockées de façon permanente par l'application.",
      },
      actions: {
        extract: "Extraire la facture",
        format: "Format",
        download: "Télécharger",
      },
      status: {
        chooseFile: "Sélectionnez d'abord un PDF.",
        reading: "Lecture de la facture…",
        extractionFailed: "Échec de l'extraction.",
        networkError: "Impossible de contacter le serveur. Vérifiez votre connexion et réessayez.",
        extractFirst: "Extrayez une facture avant d'exporter.",
        preparing: "Préparation du téléchargement…",
        exportFailed: "Échec de l'export.",
        downloaded: (v) => `Téléchargé : ${v.filename}.`,
        ready: "Prêt à exporter",
        needsReview: "Vérification recommandée",
        blocked: "Correction requise",
        noIssues: "Aucun problème détecté lors de l'extraction.",
        blockedSummary: (v) =>
          v.count === 1
            ? "1 champ doit être corrigé avant l'export."
            : `${v.count} champs doivent être corrigés avant l'export.`,
        reviewSummary: (v) =>
          v.count === 1
            ? "1 champ mérite une vérification rapide avant l'export."
            : `${v.count} champs méritent une vérification rapide avant l'export.`,
      },
      groups: {
        invoice: "Facture",
        supplier: "Fournisseur",
        customer: "Client",
        amounts: "Montants",
      },
      fields: {
        invoice_number: "N° de facture",
        invoice_date: "Date de facture",
        total_amount: "Montant total",
        subtotal: "Sous-total",
        tax_amount: "Montant de la TVA",
        currency: "Devise",
        supplier_name: "Nom du fournisseur",
        supplier_tax_id: "Identifiant fiscal du fournisseur",
        customer_name: "Nom du client",
        customer_ICE: "ICE du client",
      },
      form: {
        requiredLegend: "indique un champ obligatoire pour l'export.",
        edited: "Modifié – validé lors du téléchargement.",
        note: "Corrigez les champs ci-dessus, puis choisissez un format et téléchargez.",
      },
    },
  };

  // The finite set of backend-authored English strings that are ever
  // displayed verbatim to the user (app/pdf.py, app/main.py, app/review.py).
  // Matched at the presentation layer only -- the backend API contract,
  // issue objects, and validation messages are never modified. Anything
  // that doesn't match a rule here is shown as-is (English) rather than
  // risk an inaccurate translation of an unexpected backend message.
  const BACKEND_MESSAGE_RULES = [
    { match: "Invoice number is missing.", fr: "Le numéro de facture est manquant." },
    { match: "Invoice date is missing.", fr: "La date de facture est manquante." },
    { match: "Total amount is missing.", fr: "Le montant total est manquant." },
    { match: "No currency detected", fr: "Aucune devise détectée." },
    { match: "Customer ICE must contain 15 digits.", fr: "L'ICE du client doit contenir 15 chiffres." },
    {
      match: "Subtotal + tax amount does not equal total amount.",
      fr: "Le sous-total plus la TVA ne correspond pas au montant total.",
    },
    { match: "Supplier name is missing.", fr: "Le nom du fournisseur est manquant." },
    {
      match: "Invalid file type. Only PDF files are allowed.",
      fr: "Type de fichier invalide. Seuls les fichiers PDF sont autorisés.",
    },
    {
      match: "Password-protected or encrypted PDFs are not supported.",
      fr: "Les PDF protégés par mot de passe ou chiffrés ne sont pas pris en charge.",
    },
    {
      match: "Corrupted or invalid PDF file structure.",
      fr: "Structure de fichier PDF corrompue ou invalide.",
    },
    {
      match: "No extractable text found. Scanned PDFs are not supported in this version.",
      fr: "Aucun texte extractible trouvé. Les PDF scannés ne sont pas pris en charge dans cette version.",
    },
    { match: "Failed to generate export file", fr: "Échec de la génération du fichier d'export." },
    {
      match: "Corrected invoice failed validation.",
      fr: "La facture corrigée n'a pas passé la validation.",
    },
    {
      regex: /^Multiple currencies detected: (.+)\.$/,
      fr: (m) => `Plusieurs devises détectées : ${m[1]}.`,
    },
    {
      regex: /^Multiple customer (.+) values detected: (.+)\.$/,
      fr: (m) => `Plusieurs valeurs de ${m[1]} client détectées : ${m[2]}.`,
    },
    {
      regex: /^Multiple supplier (.+) values detected: (.+)\.$/,
      fr: (m) => `Plusieurs valeurs de ${m[1]} fournisseur détectées : ${m[2]}.`,
    },
    {
      regex: /^PDF exceeds the ([\d.]+) MB limit\.$/,
      fr: (m) => `Le PDF dépasse la limite de ${m[1]} Mo.`,
    },
  ];

  function translateBackendMessage(message) {
    if (currentLang !== "fr" || typeof message !== "string") return message;
    for (const rule of BACKEND_MESSAGE_RULES) {
      if (rule.match !== undefined && message === rule.match) return rule.fr;
      if (rule.regex) {
        const found = message.match(rule.regex);
        if (found) return rule.fr(found);
      }
    }
    // Unknown/unexpected backend text (e.g. a raw Pydantic validation
    // message): shown as-is rather than guessed at.
    return message;
  }

  function loadStoredLang() {
    try {
      const stored = localStorage.getItem(LANG_STORAGE_KEY);
      return SUPPORTED_LANGS.includes(stored) ? stored : DEFAULT_LANG;
    } catch (err) {
      return DEFAULT_LANG;
    }
  }

  function persistLang(lang) {
    try {
      localStorage.setItem(LANG_STORAGE_KEY, lang);
    } catch (err) {
      // localStorage may be unavailable (private browsing, disabled
      // storage). The chosen language still applies for this session --
      // it just won't be remembered next visit.
    }
  }

  let currentLang = loadStoredLang();

  function t(path, vars) {
    const dict = translations[currentLang] || translations[DEFAULT_LANG];
    const fallbackDict = translations[DEFAULT_LANG];
    const resolve = (dictionary) =>
      path.split(".").reduce((acc, part) => (acc == null ? acc : acc[part]), dictionary);
    const value = resolve(dict);
    const resolved = value !== undefined ? value : resolve(fallbackDict);
    return typeof resolved === "function" ? resolved(vars) : resolved;
  }

  function applyStaticTranslations() {
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll("[data-i18n-aria-label]").forEach((el) => {
      el.setAttribute("aria-label", t(el.dataset.i18nAriaLabel));
    });
    document.title = t("doc.title");
    document.documentElement.lang = currentLang;
  }

  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const selectedFilename = document.getElementById("selected-filename");
  const previewBtn = document.getElementById("preview-btn");
  const exportBtn = document.getElementById("export-btn");
  const formatSelect = document.getElementById("format-select");
  const statusLine = document.getElementById("status-line");
  const statusIcon = statusLine.querySelector(".status-icon");
  const statusText = statusLine.querySelector(".status-text");
  const resultEl = document.getElementById("result");
  const langButtons = {
    fr: document.getElementById("lang-btn-fr"),
    en: document.getElementById("lang-btn-en"),
  };

  // Set once a preview has succeeded, cleared whenever the file changes.
  // Export reads from this rather than "whatever file happens to be
  // selected right now" -- that's what makes it export the *reviewed*
  // invoice instead of silently re-running extraction on a possibly
  // different file the person picked afterward.
  let currentFilenameStem = null;

  function updateExportAvailability(busy) {
    const available = !busy && Boolean(currentFilenameStem);
    exportBtn.disabled = !available;
    exportBtn.classList.toggle("emphasis", available);
  }

  updateExportAvailability(false);

  fileInput.addEventListener("change", () => {
    currentFilenameStem = null;
    updateExportAvailability(false);
    resultEl.replaceChildren();
    resultRetranslators = [];
    setStatus("");

    const file = fileInput.files[0];
    selectedFilename.textContent = file ? file.name : "";
    dropzone.classList.toggle("has-file", Boolean(file));
  });

  ["dragenter", "dragover"].forEach((eventName) => {
    dropzone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropzone.classList.add("dragging");
    });
  });

  ["dragleave", "dragend"].forEach((eventName) => {
    dropzone.addEventListener(eventName, (event) => {
      if (eventName === "dragleave" && dropzone.contains(event.relatedTarget)) return;
      dropzone.classList.remove("dragging");
    });
  });

  dropzone.addEventListener("drop", (event) => {
    event.preventDefault();
    dropzone.classList.remove("dragging");

    const file = event.dataTransfer?.files?.[0];
    if (!file) return;

    const transfer = new DataTransfer();
    transfer.items.add(file);
    fileInput.files = transfer.files;
    fileInput.dispatchEvent(new Event("change", { bubbles: true }));
  });

  // Without this, dropping a file anywhere outside the dropzone would make
  // the browser navigate to/open it instead of doing nothing.
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => event.preventDefault());

  // The status line remembers *how to render itself* (a closure over the
  // data needed, not a pre-translated string) so that switching language
  // can redraw the current message -- success, error, or busy text --
  // without re-running the request that produced it.
  let lastStatusRender = () => "";
  let lastStatusIsError = false;

  function applyStatusRender() {
    const message = lastStatusRender();
    statusText.textContent = message || "";
    statusIcon.textContent = message && lastStatusIsError ? "⚠" : "";
    statusLine.classList.toggle("error", Boolean(message && lastStatusIsError));
  }

  function setStatus(renderFn, isError) {
    lastStatusRender = typeof renderFn === "function" ? renderFn : () => renderFn || "";
    lastStatusIsError = Boolean(isError);
    applyStatusRender();
  }

  function getErrorMessage(payload, fallbackKey) {
    if (payload && typeof payload.detail === "string") {
      return translateBackendMessage(payload.detail);
    }

    if (payload?.detail && typeof payload.detail.message === "string") {
      return translateBackendMessage(payload.detail.message);
    }

    if (Array.isArray(payload?.detail)) {
      const messages = payload.detail
        .map((error) => {
          const field = error.loc?.at(-1);
          const match = INVOICE_FIELDS.find(([key]) => key === field);
          const label = match ? t(`fields.${field}`) : field;

          return `${field ? `${label}: ` : ""}${error.msg}`;
        })
        .join(" ");

      return messages || t(fallbackKey);
    }

    return t(fallbackKey);
  }

  function requireFile() {
    const file = fileInput.files[0];
    if (!file) {
      setStatus(() => t("status.chooseFile"), true);
      return null;
    }
    return file;
  }

  function setBusy(busy) {
    previewBtn.disabled = busy;
    updateExportAvailability(busy);
    statusLine.classList.toggle("busy", busy);
  }

  const STATUS_ICONS = {
    ready: "✓",
    needs_review: "!",
    blocked: "✕",
  };

  const STATUS_KEYS = {
    ready: "status.ready",
    needs_review: "status.needsReview",
    blocked: "status.blocked",
  };

  // One entry per InvoiceData field. `type` picks the HTML input type;
  // date fields already arrive as "YYYY-MM-DD" from the backend, which is
  // exactly the format <input type="date"> expects. Labels are looked up
  // through t(`fields.${key}`) at render/retranslate time, not stored here.
  const INVOICE_FIELDS = [
    ["invoice_number", "text"],
    ["invoice_date", "date"],
    ["total_amount", "number"],
    ["subtotal", "number"],
    ["tax_amount", "number"],
    ["currency", "text"],
    ["supplier_name", "text"],
    ["supplier_tax_id", "text"],
    ["customer_name", "text"],
    ["customer_ICE", "text"],
  ];

  // Purely a rendering grouping -- the data model, field keys, and
  // INVOICE_FIELDS above (used for export + error-label lookups) are
  // unaffected by how the fields are visually organized.
  const FIELD_GROUPS = [
    { key: "invoice", fields: ["invoice_number", "invoice_date"] },
    { key: "supplier", fields: ["supplier_name", "supplier_tax_id"] },
    { key: "customer", fields: ["customer_name", "customer_ICE"] },
    { key: "amounts", fields: ["total_amount", "subtotal", "tax_amount", "currency"] },
  ];

  // Required per InvoiceData (app/models.py); shown as a visual hint only --
  // no native `required` attribute is set, so client-side validation
  // semantics are unchanged. The server remains the source of truth.
  const REQUIRED_FIELDS = new Set([
    "invoice_number",
    "invoice_date",
    "supplier_name",
    "total_amount",
    "currency",
  ]);

  const FIELD_META = new Map(INVOICE_FIELDS.map(([key, type]) => [key, { type }]));

  // Retranslators for the dynamically-rendered #result panel: each entry
  // is a {el, render} pair applied on language switch. This -- not a
  // re-render -- is what makes localization state-safe: <input> elements
  // and their current values/classes are never touched here.
  let resultRetranslators = [];

  function registerRetranslate(el, render) {
    resultRetranslators.push({ el, render });
    el.textContent = render();
  }

  function retranslateResult() {
    resultRetranslators.forEach(({ el, render }) => {
      el.textContent = render();
    });
  }

  function renderField(key, issues, data) {
    const { type: inputType } = FIELD_META.get(key);
    const fieldIssues = issues.filter((issue) => issue.field === key);
    const hasError = fieldIssues.some((issue) => issue.severity === "error");
    const hasWarning = fieldIssues.some((issue) => issue.severity === "warning");

    const row = document.createElement("div");
    row.className = "field-row";
    if (hasError) row.classList.add("has-error");
    else if (hasWarning) row.classList.add("has-warning");

    const fieldId = `field-${key}`;

    const labelEl = document.createElement("label");
    labelEl.setAttribute("for", fieldId);
    const labelText = document.createElement("span");
    labelEl.appendChild(labelText);
    registerRetranslate(labelText, () => t(`fields.${key}`));
    if (REQUIRED_FIELDS.has(key)) {
      const mark = document.createElement("span");
      mark.className = "required-mark";
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = " *";
      labelEl.appendChild(mark);
    }
    row.appendChild(labelEl);

    const input = document.createElement("input");
    input.type = inputType;
    input.id = fieldId;
    input.name = key;
    if (hasError) {
      input.setAttribute("aria-invalid", "true");
    }

    // Every field shows, even ones that came back empty -- that's the
    // point of an editable form: filling in exactly what's missing.
    const value = data[key];
    input.value = value === null || value === undefined ? "" : value;
    if (inputType === "number") input.step = "0.01";
    row.appendChild(input);

    const issueIds = [];

    for (const [index, issue] of fieldIssues.entries()) {
      const issueId = `${fieldId}-issue-${index}`;
      issueIds.push(issueId);

      const message = document.createElement("p");
      message.id = issueId;
      message.className = `field-message ${issue.severity === "error" ? "issue-error" : "issue-warning"}`;
      const icon = issue.severity === "error" ? "✕" : "⚠";
      registerRetranslate(message, () => `${icon} ${translateBackendMessage(issue.message)}`);
      row.appendChild(message);
    }

    if (issueIds.length) {
      input.setAttribute("aria-describedby", issueIds.join(" "));
    }

    // If this field had an extraction issue, clear the stale
    // error/warning as soon as the person changes it -- showing
    // "must contain 15 digits" after they've already fixed it is
    // actively misleading. This does NOT re-validate anything; it
    // just stops displaying a judgment about a value that no longer
    // exists. The real check (InvoiceData's own rules, server-side)
    // still runs on Download and is what actually decides correctness.
    if (hasError || hasWarning) {
      input.addEventListener(
        "input",
        () => {
          row.classList.remove("has-error", "has-warning");
          input.removeAttribute("aria-invalid");
          input.removeAttribute("aria-describedby");
          row.querySelectorAll(".field-message").forEach((el) => el.remove());
          row.classList.add("edited");
          const note = document.createElement("p");
          note.className = "field-message field-message-edited";
          registerRetranslate(note, () => `✎ ${t("form.edited")}`);
          row.appendChild(note);
        },
        { once: true }
      );
    }

    return row;
  }

  function statusSummary(status, issues) {
    const errorCount = issues.filter((issue) => issue.severity === "error").length;
    const warningCount = issues.filter((issue) => issue.severity === "warning").length;

    if (status === "blocked") {
      return t("status.blockedSummary", { count: errorCount });
    }
    if (status === "needs_review") {
      return t("status.reviewSummary", { count: warningCount });
    }
    return t("status.noIssues");
  }

  function renderResult(payload) {
    const data = payload.data || {};
    const issues = payload.issues || [];
    const status = payload.status;

    resultEl.replaceChildren();
    resultRetranslators = [];

    const panel = document.createElement("div");
    panel.className = "panel";

    const badge = document.createElement("span");
    badge.className = `badge ${status}`;
    const icon = STATUS_ICONS[status] || "";
    registerRetranslate(badge, () => {
      const label = STATUS_KEYS[status] ? t(STATUS_KEYS[status]) : status.replace("_", " ");
      return icon ? `${icon} ${label}` : label;
    });
    panel.appendChild(badge);

    const summary = document.createElement("p");
    summary.className = "status-summary";
    registerRetranslate(summary, () => statusSummary(status, issues));
    panel.appendChild(summary);

    const legend = document.createElement("p");
    legend.className = "form-legend";
    const legendMark = document.createElement("span");
    legendMark.className = "required-mark";
    legendMark.setAttribute("aria-hidden", "true");
    legendMark.textContent = "*";
    legend.appendChild(legendMark);
    const legendText = document.createElement("span");
    legend.appendChild(legendText);
    registerRetranslate(legendText, () => ` ${t("form.requiredLegend")}`);
    panel.appendChild(legend);

    const form = document.createElement("form");
    form.className = "invoice-form";
    form.noValidate = true;

    for (const group of FIELD_GROUPS) {
      const fieldset = document.createElement("fieldset");
      fieldset.className = "field-group";

      const groupLegend = document.createElement("legend");
      registerRetranslate(groupLegend, () => t(`groups.${group.key}`));
      fieldset.appendChild(groupLegend);

      const grid = document.createElement("div");
      grid.className = "fieldset-grid";
      for (const key of group.fields) {
        grid.appendChild(renderField(key, issues, data));
      }
      fieldset.appendChild(grid);

      form.appendChild(fieldset);
    }

    panel.appendChild(form);

    const note = document.createElement("p");
    note.className = "form-note";
    registerRetranslate(note, () => t("form.note"));
    panel.appendChild(note);

    resultEl.appendChild(panel);
  }

  // Reads the live (possibly edited) value of every InvoiceData field
  // straight from its input, rather than the original /extract payload --
  // so corrections the person makes are what actually gets exported.
  // Empty inputs become null, not "": InvoiceData's optional fields are
  // nullable, and Pydantic will correctly reject a genuinely-blank
  // required field as null rather than silently accepting an empty
  // string as if it were a valid invoice number.
  function collectInvoiceFormData() {
    const result = {};
    for (const [key] of INVOICE_FIELDS) {
      const input = document.getElementById(`field-${key}`);
      const raw = input ? input.value : "";
      result[key] = raw === "" ? null : raw;
    }
    return result;
  }

  previewBtn.addEventListener("click", async () => {
    const file = requireFile();
    if (!file) return;

    setBusy(true);
    setStatus(() => t("status.reading"));
    resultEl.replaceChildren();
    resultRetranslators = [];
    currentFilenameStem = null;

    const body = new FormData();
    body.append("file", file);

    try {
      const response = await fetch("/extract", { method: "POST", body });
      const payload = await response.json();

      if (!response.ok) {
        setStatus(() => getErrorMessage(payload, "status.extractionFailed"), true);
        return;
      }

      setStatus("");
      renderResult(payload);

      // Strip whatever extension the upload had -- "my_invoice.pdf" -> "my_invoice".
      currentFilenameStem = file.name.replace(/\.[^./]+$/, "") || "invoice";
    } catch (err) {
      setStatus(() => t("status.networkError"), true);
    } finally {
      setBusy(false);
    }
  });

  exportBtn.addEventListener("click", async () => {
    if (!currentFilenameStem) {
      setStatus(() => t("status.extractFirst"), true);
      return;
    }

    setBusy(true);
    setStatus(() => t("status.preparing"));

    const format = formatSelect.value;
    const invoiceData = collectInvoiceFormData();

    try {
      const response = await fetch(
        `/export?format=${format}&filename=${encodeURIComponent(currentFilenameStem)}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(invoiceData),
        }
      );

      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        const issues = payload.detail && payload.detail.issues;
        setStatus(() => {
          const detail = getErrorMessage(payload, "status.exportFailed");
          const translatedIssues =
            Array.isArray(issues) && issues.length
              ? issues.map(translateBackendMessage).join(" ")
              : "";
          return translatedIssues ? `${detail} ${translatedIssues}` : detail;
        }, true);
        return;
      }

      const blob = await response.blob();
      const disposition = response.headers.get("Content-Disposition") || "";
      const match = disposition.match(/filename="?([^"]+)"?/);
      const filename = match ? match[1] : `${currentFilenameStem}.${format}`;

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);

      setStatus(() => t("status.downloaded", { filename }));
    } catch (err) {
      setStatus(() => t("status.networkError"), true);
    } finally {
      setBusy(false);
    }
  });

  function setLanguage(lang, persist) {
    if (!SUPPORTED_LANGS.includes(lang)) return;
    currentLang = lang;
    if (persist) persistLang(lang);

    applyStaticTranslations();
    Object.entries(langButtons).forEach(([code, btn]) => {
      btn.setAttribute("aria-pressed", String(code === lang));
    });
    applyStatusRender();
    retranslateResult();
  }

  langButtons.fr.addEventListener("click", () => setLanguage("fr", true));
  langButtons.en.addEventListener("click", () => setLanguage("en", true));

  // Apply the stored/default language on load. Not persisted here --
  // localStorage is only written on an explicit user selection above.
  setLanguage(currentLang, false);
</script>
</body>
</html>
