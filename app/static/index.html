<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Invoice Extractor</title>
<style>
  :root {
    --ink: #1c2530;
    --muted: #6b6459;
    --paper: #f5f4f0;
    --surface: #ffffff;
    --line: #dcd7cd;
    --line-strong: #c4beb1;
    --accent: #2f6f4f;
    --accent-dark: #245a3f;
    --accent-soft: #e3f1e9;
    --accent-ink: #ffffff;
    --error: #a3382c;
    --error-soft: #f7e4e1;
    --error-line: #e0b6ae;
    --warning: #8a5a10;
    --warning-soft: #fbeecf;
    --edited: #4a6a8a;
    --focus-ring: #2f6f4f;
    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(28, 37, 48, 0.06);
  }

  * { box-sizing: border-box; }

  :focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header.app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .app-header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 1.35rem;
  }

  .app-title {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 0.4rem;
  }

  .app-title .mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.9rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  p.lede {
    color: var(--muted);
    margin: 0;
    max-width: 58ch;
    font-size: 1rem;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .panel + .panel {
    margin-top: 1.5rem;
  }

  .panel-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 1rem;
  }

  /* Dropzone */
  .dropzone {
    position: relative;
    border: 2px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 2rem 1.25rem;
    text-align: center;
    background: var(--paper);
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .dropzone.dragging {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .dropzone.has-file {
    border-style: solid;
    border-color: var(--line-strong);
  }

  .visually-hidden-input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .visually-hidden-input:focus-visible + .dropzone-label {
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
    border-radius: calc(var(--radius) - 2px);
  }

  .dropzone-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
  }

  .dropzone-icon {
    width: 2rem;
    height: 2rem;
    color: var(--muted);
  }

  .dropzone-title {
    font-weight: 600;
    font-size: 1rem;
  }

  .dropzone-title .browse-text {
    color: var(--accent);
    text-decoration: underline;
  }

  .dropzone-sub {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .dropzone-filename {
    margin: 0.85rem 0 0;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .dropzone-filename:empty {
    display: none;
  }

  .field-hint {
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    margin-top: 1.25rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
  }

  .format-control {
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }

  .inline-field-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
  }

  select {
    font: inherit;
    font-size: 0.9rem;
    height: 2.65rem;
    padding: 0 0.7rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }

  button {
    font: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    height: 2.65rem;
    padding: 0 1.2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }

  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
  }

  button.primary:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  button.secondary {
    background: var(--surface);
    border-color: var(--line-strong);
    color: var(--ink);
  }

  button.secondary:hover:not(:disabled) {
    border-color: var(--ink);
  }

  button.secondary.emphasis {
    border-color: var(--accent);
    color: var(--accent-dark);
    background: var(--accent-soft);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status-line {
    margin-top: 1rem;
    font-size: 0.875rem;
    color: var(--muted);
    min-height: 1.4em;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  .status-spinner {
    display: none;
    width: 0.85em;
    height: 0.85em;
    flex-shrink: 0;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
  }

  .status-line.busy .status-spinner {
    display: inline-block;
  }

  @media (prefers-reduced-motion: no-preference) {
    .status-line.busy .status-spinner {
      animation: spin 0.7s linear infinite;
    }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status-line.error {
    color: var(--error);
    background: var(--error-soft);
    border: 1px solid var(--error-line);
    border-radius: 6px;
    padding: 0.55rem 0.75rem;
  }

  .status-icon:empty {
    display: none;
  }

  #result {
    margin-top: 1.5rem;
  }

  #result:empty {
    display: none;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .badge.ready { background: var(--accent-soft); color: var(--accent-dark); }
  .badge.needs_review { background: var(--warning-soft); color: var(--warning); }
  .badge.blocked { background: var(--error-soft); color: var(--error); }

  .status-summary {
    margin: 0 0 1.25rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .form-legend {
    margin: 0 0 1.25rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .required-mark {
    color: var(--error);
  }

  form.invoice-form {
    margin-top: 0;
  }

  fieldset.field-group {
    border: 0;
    margin: 0;
    padding: 0;
    min-width: 0;
  }

  fieldset.field-group + fieldset.field-group {
    margin-top: 2.1rem;
  }

  fieldset.field-group legend {
    width: 100%;
    padding: 0 0 0.5rem;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .fieldset-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem 1.25rem;
  }

  .field-row label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 0.35rem;
  }

  .field-row input {
    width: 100%;
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }

  .field-row input[type="number"] {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .field-row input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .field-row.has-error input { border-color: var(--error); }
  .field-row.has-warning input { border-color: var(--warning); }
  .field-row.edited input { border-color: var(--edited); }

  .field-message {
    margin: 0.35rem 0 0;
    font-size: 0.8rem;
  }

  .field-message.issue-error { color: var(--error); }
  .field-message.issue-warning { color: var(--warning); }
  .field-message.field-message-edited { color: var(--edited); font-style: italic; }

  .form-note {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 1.25rem 0 0;
    padding-top: 0.85rem;
    border-top: 1px dashed var(--line);
  }

  @media (min-width: 640px) {
    .fieldset-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 480px) {
    .app-header-inner { padding: 1.25rem 1rem 1.1rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .panel { padding: 1.15rem; }
    .actions { flex-direction: column; align-items: stretch; }
    .actions > button,
    .actions > .format-control { width: 100%; }
    .format-control select { flex: 1; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">
    <p class="app-title"><span class="mark" aria-hidden="true">IE</span> Invoice Extractor</p>
    <p class="lede">
      Extracts structured invoice fields for human review, correction, and
      CSV or Excel export.
    </p>
  </div>
</header>

<main>
  <div class="panel">
    <p class="panel-title">Upload an invoice</p>

    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept="application/pdf" class="visually-hidden-input" />
      <label for="file-input" class="dropzone-label">
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="M7 8l5-5 5 5" />
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
        </svg>
        <span class="dropzone-title"><span class="browse-text">Click to upload</span> or drag and drop</span>
        <span class="dropzone-sub">PDF only, up to 10 MB</span>
      </label>
      <p class="dropzone-filename" id="selected-filename" aria-live="polite"></p>
    </div>

    <p class="field-hint">
      Text-based PDFs only (max 10 MB). Uploaded invoices are processed
      transiently and are not permanently stored by the application.
    </p>

    <div class="actions">
      <button type="button" class="primary" id="preview-btn">Extract invoice</button>
      <div class="format-control">
        <label for="format-select" class="inline-field-label">Format</label>
        <select id="format-select">
          <option value="csv">CSV</option>
          <option value="xlsx">Excel</option>
        </select>
      </div>
      <button type="button" class="secondary" id="export-btn" disabled>Download</button>
    </div>

    <div id="status-line" class="status-line" aria-live="polite" role="status">
      <span class="status-spinner" aria-hidden="true"></span>
      <span class="status-icon" aria-hidden="true"></span>
      <span class="status-text"></span>
    </div>
  </div>

  <div id="result"></div>
</main>

<script>
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const selectedFilename = document.getElementById("selected-filename");
  const previewBtn = document.getElementById("preview-btn");
  const exportBtn = document.getElementById("export-btn");
  const formatSelect = document.getElementById("format-select");
  const statusLine = document.getElementById("status-line");
  const statusIcon = statusLine.querySelector(".status-icon");
  const statusText = statusLine.querySelector(".status-text");
  const resultEl = document.getElementById("result");

  // Set once a preview has succeeded, cleared whenever the file changes.
  // Export reads from this rather than "whatever file happens to be
  // selected right now" -- that's what makes it export the *reviewed*
  // invoice instead of silently re-running extraction on a possibly
  // different file the person picked afterward.
  let currentFilenameStem = null;

  function updateExportAvailability(busy) {
    const available = !busy && Boolean(currentFilenameStem);
    exportBtn.disabled = !available;
    exportBtn.classList.toggle("emphasis", available);
  }

  updateExportAvailability(false);

  fileInput.addEventListener("change", () => {
    currentFilenameStem = null;
    updateExportAvailability(false);
    resultEl.replaceChildren();
    setStatus("");

    const file = fileInput.files[0];
    selectedFilename.textContent = file ? file.name : "";
    dropzone.classList.toggle("has-file", Boolean(file));
  });

  ["dragenter", "dragover"].forEach((eventName) => {
    dropzone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropzone.classList.add("dragging");
    });
  });

  ["dragleave", "dragend"].forEach((eventName) => {
    dropzone.addEventListener(eventName, (event) => {
      if (eventName === "dragleave" && dropzone.contains(event.relatedTarget)) return;
      dropzone.classList.remove("dragging");
    });
  });

  dropzone.addEventListener("drop", (event) => {
    event.preventDefault();
    dropzone.classList.remove("dragging");

    const file = event.dataTransfer?.files?.[0];
    if (!file) return;

    const transfer = new DataTransfer();
    transfer.items.add(file);
    fileInput.files = transfer.files;
    fileInput.dispatchEvent(new Event("change", { bubbles: true }));
  });

  // Without this, dropping a file anywhere outside the dropzone would make
  // the browser navigate to/open it instead of doing nothing.
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => event.preventDefault());

  function setStatus(message, isError) {
    statusText.textContent = message || "";
    statusIcon.textContent = isError ? "⚠" : "";
    statusLine.classList.toggle("error", Boolean(isError));
  }

  function getErrorMessage(payload, fallback) {
    if (payload && typeof payload.detail === "string") {
      return payload.detail;
    }

    if (payload?.detail && typeof payload.detail.message === "string") {
      return payload.detail.message;
    }

    if (Array.isArray(payload?.detail)) {
      const messages = payload.detail
        .map((error) => {
          const field = error.loc?.at(-1);
          const match = INVOICE_FIELDS.find(([key]) => key === field);
          const label = match ? match.at(1) : field;

          return `${field ? `${label}: ` : ""}${error.msg}`;
        })
        .join(" ");

      return messages || fallback;
    }

    return fallback;
  }

  function requireFile() {
    const file = fileInput.files[0];
    if (!file) {
      setStatus("Choose a PDF first.", true);
      return null;
    }
    return file;
  }

  function setBusy(busy) {
    previewBtn.disabled = busy;
    updateExportAvailability(busy);
    statusLine.classList.toggle("busy", busy);
  }

  const STATUS_LABELS = {
      ready: "Ready to export",
      needs_review: "Review recommended",
      blocked: "Correction required"
    };

  const STATUS_ICONS = {
    ready: "✓",
    needs_review: "!",
    blocked: "✕",
  };

  // One entry per InvoiceData field. `type` picks the HTML input type;
  // date fields already arrive as "YYYY-MM-DD" from the backend, which is
  // exactly the format <input type="date"> expects.
  const INVOICE_FIELDS = [
    ["invoice_number", "Invoice number", "text"],
    ["invoice_date", "Invoice date", "date"],
    ["total_amount", "Total amount", "number"],
    ["subtotal", "Subtotal", "number"],
    ["tax_amount", "Tax amount", "number"],
    ["currency", "Currency", "text"],
    ["supplier_name", "Supplier name", "text"],
    ["supplier_tax_id", "Supplier tax ID", "text"],
    ["customer_name", "Customer name", "text"],
    ["customer_ICE", "Customer ICE", "text"],
  ];

  // Purely a rendering grouping -- the data model, field keys, and
  // INVOICE_FIELDS above (used for export + error-label lookups) are
  // unaffected by how the fields are visually organized.
  const FIELD_GROUPS = [
    { title: "Invoice", fields: ["invoice_number", "invoice_date"] },
    { title: "Supplier", fields: ["supplier_name", "supplier_tax_id"] },
    { title: "Customer", fields: ["customer_name", "customer_ICE"] },
    { title: "Amounts", fields: ["total_amount", "subtotal", "tax_amount", "currency"] },
  ];

  // Required per InvoiceData (app/models.py); shown as a visual hint only --
  // no native `required` attribute is set, so client-side validation
  // semantics are unchanged. The server remains the source of truth.
  const REQUIRED_FIELDS = new Set([
    "invoice_number",
    "invoice_date",
    "supplier_name",
    "total_amount",
    "currency",
  ]);

  const FIELD_META = new Map(
    INVOICE_FIELDS.map(([key, label, type]) => [key, { label, type }])
  );

  function renderField(key, issues, data) {
    const { label, type: inputType } = FIELD_META.get(key);
    const fieldIssues = issues.filter((issue) => issue.field === key);
    const hasError = fieldIssues.some((issue) => issue.severity === "error");
    const hasWarning = fieldIssues.some((issue) => issue.severity === "warning");

    const row = document.createElement("div");
    row.className = "field-row";
    if (hasError) row.classList.add("has-error");
    else if (hasWarning) row.classList.add("has-warning");

    const fieldId = `field-${key}`;

    const labelEl = document.createElement("label");
    labelEl.setAttribute("for", fieldId);
    labelEl.textContent = label;
    if (REQUIRED_FIELDS.has(key)) {
      const mark = document.createElement("span");
      mark.className = "required-mark";
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = " *";
      labelEl.appendChild(mark);
    }
    row.appendChild(labelEl);

    const input = document.createElement("input");
    input.type = inputType;
    input.id = fieldId;
    input.name = key;
    if (hasError) {
      input.setAttribute("aria-invalid", "true");
    }

    // Every field shows, even ones that came back empty -- that's the
    // point of an editable form: filling in exactly what's missing.
    const value = data[key];
    input.value = value === null || value === undefined ? "" : value;
    if (inputType === "number") input.step = "0.01";
    row.appendChild(input);

    const issueIds = [];

    for (const [index, issue] of fieldIssues.entries()) {
      const issueId = `${fieldId}-issue-${index}`;
      issueIds.push(issueId);

      const message = document.createElement("p");
      message.id = issueId;
      message.className = `field-message ${issue.severity === "error" ? "issue-error" : "issue-warning"}`;
      message.textContent = `${issue.severity === "error" ? "✕" : "⚠"} ${issue.message}`;
      row.appendChild(message);
    }

    if (issueIds.length) {
      input.setAttribute("aria-describedby", issueIds.join(" "));
    }

    // If this field had an extraction issue, clear the stale
    // error/warning as soon as the person changes it -- showing
    // "must contain 15 digits" after they've already fixed it is
    // actively misleading. This does NOT re-validate anything; it
    // just stops displaying a judgment about a value that no longer
    // exists. The real check (InvoiceData's own rules, server-side)
    // still runs on Download and is what actually decides correctness.
    if (hasError || hasWarning) {
      input.addEventListener(
        "input",
        () => {
          row.classList.remove("has-error", "has-warning");
          input.removeAttribute("aria-invalid");
          input.removeAttribute("aria-describedby");
          row.querySelectorAll(".field-message").forEach((el) => el.remove());
          row.classList.add("edited");
          const note = document.createElement("p");
          note.className = "field-message field-message-edited";
          note.textContent = "✎ Edited - validated when you download.";
          row.appendChild(note);
        },
        { once: true }
      );
    }

    return row;
  }

  function statusSummary(status, issues) {
    const errorCount = issues.filter((issue) => issue.severity === "error").length;
    const warningCount = issues.filter((issue) => issue.severity === "warning").length;

    if (status === "blocked") {
      return `${errorCount} field${errorCount === 1 ? "" : "s"} must be corrected before export.`;
    }
    if (status === "needs_review") {
      return `${warningCount} field${warningCount === 1 ? "" : "s"} may need a quick check before export.`;
    }
    return "No issues were found during extraction.";
  }

  function renderResult(payload) {
    const data = payload.data || {};
    const issues = payload.issues || [];

    resultEl.replaceChildren();

    const panel = document.createElement("div");
    panel.className = "panel";

    const badge = document.createElement("span");
    badge.className = `badge ${payload.status}`;
    const icon = STATUS_ICONS[payload.status] || "";
    const label = STATUS_LABELS[payload.status] || payload.status.replace("_", " ");
    badge.textContent = icon ? `${icon} ${label}` : label;
    panel.appendChild(badge);

    const summary = document.createElement("p");
    summary.className = "status-summary";
    summary.textContent = statusSummary(payload.status, issues);
    panel.appendChild(summary);

    const legend = document.createElement("p");
    legend.className = "form-legend";
    const legendMark = document.createElement("span");
    legendMark.className = "required-mark";
    legendMark.setAttribute("aria-hidden", "true");
    legendMark.textContent = "*";
    legend.appendChild(legendMark);
    legend.appendChild(document.createTextNode(" indicates a field required for export."));
    panel.appendChild(legend);

    const form = document.createElement("form");
    form.className = "invoice-form";
    form.noValidate = true;

    for (const group of FIELD_GROUPS) {
      const fieldset = document.createElement("fieldset");
      fieldset.className = "field-group";

      const groupLegend = document.createElement("legend");
      groupLegend.textContent = group.title;
      fieldset.appendChild(groupLegend);

      const grid = document.createElement("div");
      grid.className = "fieldset-grid";
      for (const key of group.fields) {
        grid.appendChild(renderField(key, issues, data));
      }
      fieldset.appendChild(grid);

      form.appendChild(fieldset);
    }

    panel.appendChild(form);

    const note = document.createElement("p");
    note.className = "form-note";
    note.textContent = "Correct any fields above, then choose a format and download.";
    panel.appendChild(note);

    resultEl.appendChild(panel);
  }

  // Reads the live (possibly edited) value of every InvoiceData field
  // straight from its input, rather than the original /extract payload --
  // so corrections the person makes are what actually gets exported.
  // Empty inputs become null, not "": InvoiceData's optional fields are
  // nullable, and Pydantic will correctly reject a genuinely-blank
  // required field as null rather than silently accepting an empty
  // string as if it were a valid invoice number.
  function collectInvoiceFormData() {
    const result = {};
    for (const [key] of INVOICE_FIELDS) {
      const input = document.getElementById(`field-${key}`);
      const raw = input ? input.value : "";
      result[key] = raw === "" ? null : raw;
    }
    return result;
  }

  previewBtn.addEventListener("click", async () => {
    const file = requireFile();
    if (!file) return;

    setBusy(true);
    setStatus("Reading invoice…");
    resultEl.replaceChildren();
    currentFilenameStem = null;

    const body = new FormData();
    body.append("file", file);

    try {
      const response = await fetch("/extract", { method: "POST", body });
      const payload = await response.json();

      if (!response.ok) {
        setStatus(getErrorMessage(payload, "Extraction failed."), true);
        return;
      }

      setStatus("");
      renderResult(payload);

      // Strip whatever extension the upload had -- "my_invoice.pdf" -> "my_invoice".
      currentFilenameStem = file.name.replace(/\.[^./]+$/, "") || "invoice";
    } catch (err) {
      setStatus("Could not reach the server. Check your connection and try again.", true);
    } finally {
      setBusy(false);
    }
  });

  exportBtn.addEventListener("click", async () => {
    if (!currentFilenameStem) {
      setStatus("Extract an invoice before exporting.", true);
      return;
    }

    setBusy(true);
    setStatus("Preparing download…");

    const format = formatSelect.value;
    const invoiceData = collectInvoiceFormData();

    try {
      const response = await fetch(
        `/export?format=${format}&filename=${encodeURIComponent(currentFilenameStem)}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(invoiceData),
        }
      );

      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        const detail = getErrorMessage(payload, "Export failed.");
        const issues = payload.detail && payload.detail.issues;
        const fullMessage = Array.isArray(issues) && issues.length
          ? `${detail} ${issues.join(" ")}`
          : detail;
        setStatus(fullMessage, true);
        return;
      }

      const blob = await response.blob();
      const disposition = response.headers.get("Content-Disposition") || "";
      const match = disposition.match(/filename="?([^"]+)"?/);
      const filename = match ? match[1] : `${currentFilenameStem}.${format}`;

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);

      setStatus(`Downloaded ${filename}.`);
    } catch (err) {
      setStatus("Could not reach the server. Check your connection and try again.", true);
    } finally {
      setBusy(false);
    }
  });
</script>
</body>
</html>
